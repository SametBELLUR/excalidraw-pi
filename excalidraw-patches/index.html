    <!------------------------------------------------------------------------->
    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("excalidraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            return theme || "light";
          }
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>

    <!-- Warmup the connection for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!------------------------------------------------------------------------->
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <script>
      // Redirect Excalidraw+ users which have auto-redirect enabled.
      //
      // Redirect only the bare root path, so link/room/library urls are not
      // redirected.
      //
      // Putting into index.html for best performance (can't redirect on server
      // due to location.hash checks).
      if (
        window.location.pathname === "/" &&
        !window.location.hash &&
        !window.location.search &&
        // if its present redirect
        document.cookie.includes("excplus-autoredirect=true")
      ) {
        window.location.href = "https://app.excalidraw.com";
      }
    </script>

    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <!-- Register Assistant as the UI font, before the scene inits -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />

    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Excalidraw version -->
    <meta name="version" content="{version}" />

    <% if (typeof VITE_APP_DEV_DISABLE_LIVE_RELOAD != 'undefined' &&
    VITE_APP_DEV_DISABLE_LIVE_RELOAD == true) { %>
    <script>
      {
        const _WebSocket = window.WebSocket;
        window.WebSocket = function (url) {
          if (/ws:\/\/localhost:.+?\/sockjs-node/.test(url)) {
            console.info(
              "[!!!] Live reload is disabled via VITE_APP_DEV_DISABLE_LIVE_RELOAD [!!!]",
            );
          } else {
            return new _WebSocket(url);
          }
        };
      }
    </script>
    <% } %>
    <script>
      // setting this so that libraries installation reuses this window tab.
      window.name = "_excalidraw";
    </script>

    <!-- FIXME: remove this when we update CRA (fix SW caching) -->
    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;

        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
    <style id="auth-gate-style">body { visibility: hidden; }</style>
    <script>
      (async function () {
        var p = window.location.pathname;
        var hasTokenParam = window.location.search.includes('token=');
        function release() {
          var s = document.getElementById('auth-gate-style');
          if (s) s.remove();
        }
        function bounce() { window.location.replace('/auth/login'); }
        if (p.startsWith('/auth/') || hasTokenParam) { release(); return; }
        var token = localStorage.getItem('token');
        if (!token) { bounce(); return; }
        try {
          var res = await fetch('/api/v2/kv/', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token },
            cache: 'no-store',
            credentials: 'omit'
          });
          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('token');
            bounce();
            return;
          }
          release();
        } catch (e) {
          release();
        }
      })();

      // ─── Auto-update reload banner v2 ───
      (function () {
        if (!('serviceWorker' in navigator)) return;
        if (window.location.pathname.startsWith('/auth/')) return;

        var hadInitialController = !!navigator.serviceWorker.controller;

        function showUpdateBanner() {
          if (document.getElementById('app-update-banner')) return;

          function inject() {
            if (!document.body) {
              document.addEventListener('DOMContentLoaded', inject, { once: true });
              return;
            }
            var banner = document.createElement('div');
            banner.id = 'app-update-banner';
            banner.setAttribute('role', 'status');
            banner.style.cssText =
              'position:fixed;top:0;left:0;right:0;' +
              'padding:12px 20px;' +
              'background:#4a90e2;color:#fff;' +
              'z-index:999999;' +
              'text-align:center;' +
              'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;' +
              'font-size:14px;' +
              'box-shadow:0 2px 8px rgba(0,0,0,0.15);' +
              'display:flex;align-items:center;justify-content:center;gap:12px;';
            banner.innerHTML =
              '<span>Yeni versiyon mevcut.</span>' +
              '<button id="app-update-reload" type="button" ' +
              'style="padding:6px 16px;background:#fff;color:#4a90e2;' +
              'border:none;border-radius:4px;cursor:pointer;' +
              'font-weight:600;font-size:13px;font-family:inherit">Yenile</button>' +
              '<button id="app-update-dismiss" type="button" aria-label="Kapat" ' +
              'style="padding:4px 9px;background:transparent;color:#fff;' +
              'border:1px solid rgba(255,255,255,0.5);border-radius:4px;' +
              'cursor:pointer;font-size:14px;line-height:1;font-family:inherit">×</button>';
            document.body.appendChild(banner);
            document.getElementById('app-update-reload')
              .addEventListener('click', function () { window.location.reload(); });
            document.getElementById('app-update-dismiss')
              .addEventListener('click', function () { banner.remove(); });
          }
          inject();
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadInitialController) showUpdateBanner();
        });

        navigator.serviceWorker.ready.then(function (reg) {
          if (reg.waiting && hadInitialController) {
            showUpdateBanner();
          }
        }).catch(function () { /* ignore */ });
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <header>
      <h1 class="visually-hidden">Excalidraw</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!-- 100% privacy friendly analytics -->
    <script>
      // need to load this script dynamically bcs. of iframe embed tracking
      var scriptEle = document.createElement("script");
      scriptEle.setAttribute(
        "src",
        "https://scripts.simpleanalyticscdn.com/latest.js",
      );
      scriptEle.setAttribute("type", "text/javascript");
      scriptEle.setAttribute("defer", true);
      scriptEle.setAttribute("async", true);
      // if iframe
      if (window.self !== window.top) {
        scriptEle.setAttribute("data-auto-collect", true);
      }

      document.body.appendChild(scriptEle);

      // if iframe
      if (window.self !== window.top) {
        scriptEle.addEventListener("load", () => {
          if (window.sa_pageview) {
            window.window.sa_event(action, {
              category: "iframe",
              label: "embed",
              value: window.location.pathname,
            });
          }
        });
      }
    </script>
    <!-- end LEGACY GOOGLE ANALYTICS -->
    <% } %>
  </body>
</html>
